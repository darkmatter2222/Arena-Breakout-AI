name: Public release cleanup

on:
  push:
    branches:
      - agent/public-release

permissions:
  contents: write

jobs:
  sanitize-source:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out release branch
        uses: actions/checkout@v4
        with:
          ref: agent/public-release
          fetch-depth: 0

      - name: Replace machine-specific VLM configuration
        shell: python
        run: |
          from pathlib import Path

          path = Path("annotate.py")
          source = path.read_text(encoding="utf-8")
          old = '''LLM_BASE_URL = "http://192.168.86.48:8001"
          LLM_MODEL = "Qwen/Qwen2.5-VL-32B-Instruct-AWQ"'''
          new = '''LLM_BASE_URL = os.getenv(
              "ARENA_AI_LLM_BASE_URL",
              "http://127.0.0.1:8001",
          ).rstrip("/")
          LLM_MODEL = os.getenv(
              "ARENA_AI_LLM_MODEL",
              "Qwen/Qwen2.5-VL-32B-Instruct-AWQ",
          )'''
          if old not in source:
              raise SystemExit("Expected VLM configuration block was not found")
          path.write_text(source.replace(old, new, 1), encoding="utf-8")

          workflow = Path(".github/workflows/public-release-cleanup.yml")
          workflow.unlink(missing_ok=True)

      - name: Commit sanitized source
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "security: move VLM endpoint configuration to environment"
          git push origin HEAD:agent/public-release
